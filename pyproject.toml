[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_log_factory"
version = "2.0.0"
description = "Simple Log Factory – a lightweight wrapper around Python's logging module."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Breno RdV", email = "hello@raccoon.ninja" },
]
keywords = ["python", "log", "logging", "factory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[project.urls]
Homepage = "https://github.com/brenordv/log-factory-package"
Repository = "https://github.com/brenordv/log-factory-package"
Issues = "https://github.com/brenordv/log-factory-package/issues"

[tool.setuptools.packages.find]
include = ["simple_log_factory*"]

[tool.setuptools.package-data]
simple_log_factory = ["py.typed", "README.md", "LICENSE.md", "CHANGELOG.md"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
